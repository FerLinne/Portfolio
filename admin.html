<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portfolio</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..900;1,9..40,100..900&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">Portfolio Admin</a>
            <div class="navbar-text text-light ms-auto">
                <span id="adminStatus">Admin Mode</span>
            </div>
        </div>
    </nav>

    <!-- Admin Container -->
    <div class="container-fluid px-4 py-5">
        <div class="row">
            <!-- Main Content -->
            <div class="col-lg-8">
                <!-- Add Project Button -->
                <div class="mb-4">
                    <button class="btn btn-success" onclick="openProjectForm()">+ Add New Project</button>
                    <a href="index.html" class="btn btn-outline-dark">← Back to Portfolio</a>
                </div>

                <!-- Projects List -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">Projects Management</h5>
                    </div>
                    <div class="card-body">
                        <div id="projectsList">
                            <!-- Projects will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-lg-4">
                <!-- Profile Photo Section -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">Profile Photo</h5>
                    </div>
                    <div class="card-body">
                        <div id="profilePhotoPreview" class="mb-3 text-center">
                            <img id="profilePhotoImg" src="images/profile.jpg" alt="Profile" style="display:none; max-width: 100%; border-radius: 8px; max-height: 200px;">
                            <div id="profilePhotoPlaceholder" style="font-size: 48px;">📸</div>
                        </div>
                        <input type="file" id="profilePhotoInput" class="form-control mb-3" accept="image/*">
                        <button class="btn btn-primary w-100" onclick="uploadProfilePhoto()">Upload Photo</button>
                    </div>
                </div>

                <!-- Logout Button -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <button class="btn btn-danger w-100" onclick="logout()">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Form Modal -->
    <div class="modal fade" id="projectFormModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="formTitle">Add New Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <input type="hidden" id="projectId">

                        <!-- Project Name -->
                        <div class="mb-3">
                            <label for="projectName" class="form-label">Project Name *</label>
                            <input type="text" class="form-control" id="projectName" required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="projectDescription" class="form-label">Short Description *</label>
                            <input type="text" class="form-control" id="projectDescription" required>
                        </div>

                        <!-- Long Description -->
                        <div class="mb-3">
                            <label for="projectLongDescription" class="form-label">Full Description</label>
                            <textarea class="form-control" id="projectLongDescription" rows="3"></textarea>
                        </div>

                        <!-- Link -->
                        <div class="mb-3">
                            <label for="projectLink" class="form-label">Project Link (URL) *</label>
                            <input type="url" class="form-control" id="projectLink" required>
                        </div>

                        <!-- Badge 1 -->
                        <div class="mb-3">
                            <label for="projectBadge" class="form-label">Badge 1</label>
                            <select class="form-control" id="projectBadge">
                                <option value="">None</option>
                                <option value="Dev">Dev</option>
                                <option value="QA · Testing">QA · Testing</option>
                                <option value="Design">Design</option>
                                <option value="DS">DS</option>
                            </select>
                        </div>

                        <!-- Badge 2 -->
                        <div class="mb-3">
                            <label for="projectBadge2" class="form-label">Badge 2</label>
                            <input type="text" class="form-control" id="projectBadge2" placeholder="e.g., UI/UX · DB Design">
                        </div>

                        <!-- Tags -->
                        <div class="mb-3">
                            <label for="projectTags" class="form-label">Tags (comma-separated)</label>
                            <input type="text" class="form-control" id="projectTags" placeholder="e.g., HTML, CSS, JavaScript">
                        </div>

                        <!-- Images -->
                        <div class="mb-3">
                            <label class="form-label">Project Images</label>
                            <input type="file" id="projectImages" class="form-control" accept="image/*" multiple>
                            <small class="text-muted">Select images from your device (will be stored as file paths)</small>
                            
                            <!-- Image Preview -->
                            <div id="imagePreview" class="mt-3" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px;">
                                <!-- Image thumbnails will appear here -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveProject()">Save Project</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Data -->
    <script>
        const projectsData = [
            {
                id: 1,
                name: "HarvestCrop",
                description: "Agricultural e-commerce platform",
                longDescription: "A comprehensive agricultural e-commerce solution built with modern web technologies.",
                tags: ["HTML", "CSS", "Bootstrap", "PHP", "MySQL", "PHPMyAdmin"],
                badge: "Dev",
                badge2: "UI/UX · DB Design",
                link: "https://example.com/harvestcrop",
                images: ["images/harvestcrop-1.png", "images/harvestcrop-2.png"]
            },
            {
                id: 2,
                name: "HerbaScan",
                description: "AI-powered herbal plant identifier",
                longDescription: "HerbaScan uses CNN and TensorFlow Lite to identify herbal plants in real-time.",
                tags: ["Flutter", "Dart", "Python", "TFLite"],
                badge: "QA · Testing",
                badge2: null,
                link: "https://example.com/herbascan",
                images: ["images/herbascan-1.png"]
            }
        ];

        if (!localStorage.getItem('projectsData')) {
            localStorage.setItem('projectsData', JSON.stringify(projectsData));
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Admin JS -->
    <script src="js/admin.js"></script>
</body>
</html>
