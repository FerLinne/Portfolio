<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..900;1,9..40,100..900&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">Portfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#projects">Back to Projects</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Project Detail Section -->
    <section class="project-detail-section py-5">
        <div class="container-fluid px-4">
            <!-- Back Button -->
            <a href="index.html#projects" class="btn btn-outline-dark mb-4">← Back</a>

            <!-- Image Carousel -->
            <div id="carouselContainer" class="mb-5">
                <div class="carousel-wrapper position-relative">
                    <div id="imageCarousel" class="carousel-images">
                        <!-- Images rendered here -->
                    </div>
                    <button id="prevBtn" class="carousel-control prev">❮</button>
                    <button id="nextBtn" class="carousel-control next">❯</button>
                </div>
                <div id="dotsContainer" class="carousel-dots mt-3 text-center">
                    <!-- Dots rendered here -->
                </div>
            </div>

            <!-- Project Info -->
            <div class="row">
                <div class="col-lg-8">
                    <!-- Title and Badges -->
                    <div class="mb-4">
                        <h1 id="projectTitle" class="display-5 fw-bold mb-3">Project Name</h1>
                        <div id="badgesContainer" class="badges-container mb-3">
                            <!-- Badges rendered here -->
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-5">
                        <p id="projectDescription" class="lead text-muted mb-4">Project description</p>
                        <p id="projectLongDescription" class="text-dark lh-lg">Detailed project description</p>
                    </div>

                    <!-- Tags -->
                    <div class="mb-5">
                        <h5 class="mb-3 fw-bold">Technologies</h5>
                        <div id="tagsContainer" class="tags-container">
                            <!-- Tags rendered here -->
                        </div>
                    </div>
                </div>

                <!-- Sidebar Actions -->
                <div class="col-lg-4">
                    <div class="sticky-lg-top pt-4" style="top: 100px;">
                        <div class="card border-0 bg-light">
                            <div class="card-body">
                                <h5 class="card-title mb-4">Project Links</h5>
                                <a id="visitLink" href="#" target="_blank" class="btn btn-dark w-100 mb-3">
                                    Visit Project →
                                </a>
                                <a href="index.html" class="btn btn-outline-dark w-100">
                                    Back to Portfolio
                                </a>
                            </div>
                        </div>
                        
                        <!-- Share Section -->
                        <div class="card border-0 bg-light mt-3">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Share</h5>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-dark btn-sm flex-grow-1" onclick="shareProject()">
                                        Share Project
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-light border-top py-4 mt-5">
        <div class="container-fluid px-4 text-center text-muted">
            <p class="mb-0">&copy; 2024 Your Name. All rights reserved.</p>
        </div>
    </footer>

    <!-- Project Data (same as index.html) -->
    <script>
        const projectsData = [
            {
                id: 1,
                name: "HarvestCrop",
                description: "Agricultural e-commerce platform connecting farmers directly with buyers.",
                longDescription: "A comprehensive agricultural e-commerce solution built with modern web technologies. HarvestCrop allows farmers to list their products, manage inventory, and connect with buyers across regions. The platform includes a robust admin panel for managing transactions and user accounts.",
                tags: ["HTML", "CSS", "Bootstrap", "PHP", "MySQL", "PHPMyAdmin"],
                badge: "Dev",
                badge2: "UI/UX · DB Design",
                link: "https://example.com/harvestcrop",
                images: ["images/harvestcrop-1.png", "images/harvestcrop-2.png", "images/harvestcrop-3.png"]
            },
            {
                id: 2,
                name: "HerbaScan",
                description: "AI-powered herbal plant identifier using CNN and mobile technology.",
                longDescription: "HerbaScan is an innovative mobile application that uses convolutional neural networks (CNN) and TensorFlow Lite to identify herbal plants in real-time. Users can capture plant images and receive instant identification along with medicinal properties.",
                tags: ["Flutter", "Dart", "Python", "MobileNetV2", "TFLite", "SQLite", "Supabase", "Railway"],
                badge: "QA · Testing",
                badge2: null,
                link: "https://example.com/herbascan",
                images: ["images/herbascan-1.png", "images/herbascan-2.png"]
            }
        ];

        if (!localStorage.getItem('projectsData')) {
            localStorage.setItem('projectsData', JSON.stringify(projectsData));
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Project Detail JS -->
    <script src="js/app.js"></script>
    <script src="js/project-detail.js"></script>
</body>
</html>
